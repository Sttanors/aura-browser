<!doctype html><meta charset="utf-8"><title>Window storage</title>
<h1>Window storage fixture</h1>
<button style="position:absolute;left:20px;top:100px;width:160px;height:40px" onclick="window.onbeforeunload=window.onbeforeunload?null:()=>true;this.textContent=window.onbeforeunload?'Protected':'Protect page'">Protect page</button>
<script>
const args=new URLSearchParams(location.search);
if(args.has('set')) {document.cookie='aura_window='+args.get('set')+'; path=/; SameSite=Lax';localStorage.setItem('aura_window',args.get('set'));}
function report(){document.title=JSON.stringify({cookie:document.cookie,storage:localStorage.getItem('aura_window'),name:args.get('name'),protected:Boolean(window.onbeforeunload)});}
report();setInterval(report,200);
</script>
