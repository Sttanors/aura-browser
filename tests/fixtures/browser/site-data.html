<!doctype html><meta charset="utf-8"><title>Site data fixture</title>
<h1>Site data fixture</h1><input value="Unsaved form">
<script>
const args=new URLSearchParams(location.search),seed=args.get('set'),token=crypto.randomUUID();
const dbname='aura-site-data',cacheName='aura-site-cache';
async function database(write){
 if(!write&&!(await indexedDB.databases()).some(x=>x.name===dbname))return null;
 return new Promise((resolve,reject)=>{const r=indexedDB.open(dbname,1);r.onupgradeneeded=()=>r.result.createObjectStore('data');r.onerror=()=>reject(r.error);r.onsuccess=()=>{const db=r.result,tx=db.transaction('data',write?'readwrite':'readonly'),s=tx.objectStore('data');if(write){s.put(write,'identity');const bytes=new Uint8Array(600000);for(let offset=0;offset<bytes.length;offset+=65536)crypto.getRandomValues(bytes.subarray(offset,Math.min(offset+65536,bytes.length)));s.put(bytes,'payload')}const get=s.get('identity');let value=null;get.onsuccess=()=>value=get.result??null;tx.oncomplete=()=>{db.close();resolve(value)};tx.onerror=()=>reject(tx.error)}});
}
(async()=>{try{
 if(seed){localStorage.setItem('identity',seed);localStorage.setItem('payload','x'.repeat(200000));document.cookie='aura_data='+seed+'; path=/; SameSite=Lax';document.cookie='aura_hidden='+seed+'; path=/hidden; SameSite=Lax';await database(seed);await navigator.serviceWorker.register('site-data-worker.js');await navigator.serviceWorker.ready;const cache=await caches.open(cacheName);await cache.put('/payload',new Response(seed+':'+('x'.repeat(100000))))}
 const idb=await database(null),keys=await caches.keys();let cached=null;
 if(keys.includes(cacheName)){const match=await(await caches.open(cacheName)).match('/payload');if(match)cached=(await match.text()).split(':')[0]}
 document.title=JSON.stringify({token,ready:true,workers:(await navigator.serviceWorker.getRegistrations()).length,idb,cached,local:localStorage.getItem('identity'),cookie:document.cookie});
}catch(e){document.title=JSON.stringify({token,error:e.name})}})();
</script>
