name: Windows browser
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'packaging/**'
      - 'scripts/build_linux_installer.py'
      - 'scripts/windows_installer_ci.ps1'
      - 'tests/python/test_installers.py'
      - '.github/workflows/installers.yml'
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 469a0504e4a6ebf6173d1c0f51a7fa34c382fd43
          path: third_party/vcpkg
      - uses: actions/cache/restore@v4
        id: dependencies
        with:
          path: |
            third_party/cache
            third_party/skia-build
            third_party/cargo-home
            third_party/adblock-build
            ~/AppData/Local/vcpkg/archives
          key: windows-deps-${{ hashFiles('third_party/dependencies.lock.json', 'scripts/build_skia.py', 'third_party/patches/*', 'core/adblock/Cargo.lock', 'vcpkg.json') }}
          # Migrate the completed dependency cache from the initial build.
          restore-keys: |
            windows-x64-${{ hashFiles('third_party/dependencies.lock.json', 'scripts/build_skia.py', 'third_party/patches/*', 'core/adblock/Cargo.lock', 'vcpkg.json') }}-cae1f82a36c9ee2182baa767d6bb69ab0eb3caac
            windows-deps-
      - name: Prepare Rust and vcpkg
        shell: pwsh
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.90.0
          & ./third_party/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch dependencies and build Skia
        shell: pwsh
        run: ./scripts/windows_ci.ps1 -Stage bootstrap
      - name: Configure browser and build system dependencies
        id: configure
        shell: pwsh
        env:
          VCPKG_MAX_CONCURRENCY: '4'
        run: ./scripts/windows_ci.ps1 -Stage configure
      - name: Compile full Windows browser
        id: build
        shell: pwsh
        run: ./scripts/windows_ci.ps1 -Stage build
      - name: Unit tests
        shell: pwsh
        run: ./scripts/windows_ci.ps1 -Stage unit
      - name: Real browser integration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/windows_ci.ps1 -Stage integration
      - name: Package portable browser
        shell: pwsh
        run: ./scripts/windows_ci.ps1 -Stage package
      - name: Build and verify branded installer
        shell: pwsh
        run: ./scripts/windows_installer_ci.ps1 -UseLocalArchive
      - uses: actions/cache/save@v4
        if: always() && steps.configure.outcome == 'success' && steps.dependencies.outputs.cache-hit != 'true'
        with:
          path: |
            third_party/cache
            third_party/skia-build
            third_party/cargo-home
            third_party/adblock-build
            ~/AppData/Local/vcpkg/archives
          key: windows-deps-${{ hashFiles('third_party/dependencies.lock.json', 'scripts/build_skia.py', 'third_party/patches/*', 'core/adblock/Cargo.lock', 'vcpkg.json') }}
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: aura-windows-x64
          path: |
            artifacts/aura2-windows64.zip
            artifacts/aura2-windows64.zip.sha256
            artifacts/aura2-windows64-setup.exe
            artifacts/aura2-windows64-setup.exe.sha256
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-diagnostics
          path: |
            artifacts/windows-smoke/
            build/windows-x64-release/Testing/Temporary/
            build/windows-x64-release/vcpkg-manifest-install.log
