name: Verify update channel
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag to authenticate'
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate metadata and every published installer
        env:
          GH_TOKEN: ${{ github.token }}
          AURA_TAG: ${{ inputs.tag }}
        run: python scripts/verify_update_release.py --tag "$AURA_TAG"
