[package]
name = "aura_adblock"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MPL-2.0"
[lib]
crate-type = ["staticlib"]
[dependencies]
adblock = { version = "=0.13.3", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
serde_json = "=1.0.149"
[profile.release]
opt-level = 3
lto = "thin"
